<!-- The main entry point for the CCST Web View application 
  -- All of the code injections, assets, styling, and page navigations are managed through index. -->
<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">

    <!-- Sets the title of the page and imports the global and app level styles -->
    <title>CCST Web View</title>
    <link rel = "stylesheet" href = "./src/styles/global.css">
    <link rel = "stylesheet" href = "./src/styles/reports.css">

    
    <!-- importmap is essential for importing the shared scripts and app scripts so their relative
      -- paths can be resolved correctly for modern browsers. This MUST be loaded before all proprietary scripts -->
    <script type = "importmap">
    {
      "imports": {
        "shared/": "./src/modules/shared/",
        "apps/": "./src/modules/apps/"
      }
    }
    </script>


    <!-- The main scripts for the app are imported here -->
    <script type = "module" src = "./config.js"></script>
    <script type = "module" src = "./src/scripts/chat-box.js"></script>
    <script type = "module" src = "./src/modules/home.js"></script>
</head>
<body>
    <!-- The main div for the application that allows for universal styling --> 
    <div id = "app-container">
        
        <!-- The header is responsible for holding the navigation elements, the app name and icon, and the organization -->
        <header class = "app-header">
            <!-- Hamburger Menu Button -->
            <button id = "sidebarToggle" class = "sidebar-toggle-btn" aria-label = "Toggle Navigation">
                <span class = "hamburger-bar"></span>
                <span class = "hamburger-bar"></span>
                <span class = "hamburger-bar"></span>
            </button>

            <!-- Contains the cureent page and the brand. -->
            <div class = "header-brand" id = "headerBrand">
                <span class = "page-title" id = "pageTitle"></span>
                <span class = "brand-title">CCST Web View</span>
            </div>

            <div class = "bar-container">
                <div class = "bar-chart">
                    <div class = "bar red"></div>
                    <div class = "bar green"></div>
                    <div class = "bar blue"></div>
                </div>
                <div class = "line"></div>
            </div>
            
            <!-- The orgs tag-->
            <div class = "org-branding">
                <img src="./static/assets/images/ccs-logo.png" alt="ccs-logo" class = "org-icon">
                <span class = "org-name">Camden County Schools Technology</span>
            </div>
        </header>

        <!-- Containes side bar and main content -->
        <!-- 2. Main Body Layout (Sidebar + Content) -->
        <div class = "app-body">
            <aside class = "sidebar collapsed" id = "sidebar"></aside>

            <!-- Wrapper for the main content such as the chat and code injections -->
            <div class = "main-content-wrapper">
                <div id = "chat-container" class = "chat-box">
                    <h3>What can I help you with?</h3>
                    <div class = "chat-input-wrapper">
                        <input type = "text" id = "chat-input" placeholder = "E.g, Do all my work for me I'm tired" />
                        <button id = "send-btn"> Generate </button>
                    </div>
                </div>

                <!-- The main block for the code injections, placeholder hides when code is generated -->
                <!-- Main dynamic content container -->
                <main class = "view-container" id = "app">
                    <div class = "placeholder-content">
                        <h2> Waiting for AI content injection...💉 </h2>
                    </div>
                </main>
            </div>
        </div>

    </div>
</body>
</html>
